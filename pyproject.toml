[project]
name = "puffer-phc"
version = "0.1.1"
description = "Simplified Perpetual Humanoid Control with Pufferlib"
authors = [
    { name = "Kyoung Whan Choe", email = "choe.kyoung@gmail.com" },
]
# default env: 3.12, isaacgym env: 3.8 (pinned per feature below)
requires-python = ">=3.8,<3.13"

[tool.pixi.workspace]
channels = ["pytorch", "nvidia", "conda-forge"]
platforms = [{ name = "linux-64-cuda", platform = "linux-64", cuda = "12.1" }]

# default: Newton / MuJoCo (py3.12, no Isaac Gym), for `--env.backend mujoco_cpu` / `mujoco_gpu`.
# isaacgym: the legacy py3.8 Isaac Gym stack: `pixi run -e isaacgym ...`.
[tool.pixi.environments]
default = ["newton"]
isaacgym = ["isaacgym"]

# The default feature is in both environments.
[tool.pixi.pypi-dependencies]
pufferlib = { git = "https://github.com/kywch/PufferLib.git", branch = "isaacgym" }
smpl_sim = { git = "https://github.com/kywch/SMPLSim.git" }
carbs = { git = "https://github.com/PufferAI/carbs.git" }
aim = "==3.29.1"
scipy = "*"
joblib = "*"
imageio = "*"
polars = "*"
pytest = ">=7.4,<9"
ruff = ">=0.17.2,<0.18"
pre-commit = "*"

[tool.pixi.activation]
# the package is not installed; scripts import puffer_phc from the repo root
env = { PYTHONPATH = "$PIXI_PROJECT_ROOT" }

[tool.pixi.feature.newton.dependencies]
python = "3.12.*"

[tool.pixi.feature.newton.pypi-dependencies]
torch = { version = "==2.12.0", index = "https://download.pytorch.org/whl/cu130" }
# main-branch pin: mujoco-warp 3.16 wraps ball-joint actuator setpoints natively. Re-pin to the 1.8.0 release when it ships.
newton = { git = "https://github.com/newton-physics/newton", rev = "7edb1bb3802375ff6a2a293cda6c3f0f246febe5", extras = ["sim"] }
# ViewerGL (live rendering, `--mode play`) needs newton's "examples" pins without the heavy, often-unbuildable
# open3d/trimesh deps that extra also pulls in.
pyglet = ">=2.1.6,<3"
imgui-bundle = ">=1.92.0"
# else the resolver takes dateutil 3 and backtracks aim's boto3 to 0.0.3, which pins six 1.7.3 (breaks pandas)
python-dateutil = "<3"

[tool.pixi.feature.newton.tasks]
test = "pytest tests -q --ignore=tests/test_isaacgym_backend.py"

[tool.pixi.feature.isaacgym.dependencies]
python = "3.8.*"
pip = ">=24.3.1,<25"
# Match with ubuntu 22.04
openssl = "==3.0.2"
cython = ">=3.0.11,<4"
setuptools = ">=75.3.0,<76"
wheel = ">=0.45.1,<0.46"
pytorch = "==2.3.1"
pytorch-cuda = "==12.1"
torchvision = ">=0.18.1,<0.19"
fsspec = ">=2024.10.0,<2025"

[tool.pixi.feature.isaacgym.pypi-dependencies]
# fails on py>=3.11; the default env loads SMPL pkls re-saved without it (smpl/strip_chumpy.py)
chumpy = { git = "https://github.com/nico-von-huene/chumpy.git" }

[tool.pixi.feature.isaacgym.activation.env]
LD_LIBRARY_PATH = "$CONDA_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
# Necessary for capturing video (resolve vulkan:No DRI3 support): https://github.com/isaac-sim/IsaacGymEnvs/issues/126
MESA_VK_DEVICE_SELECT = "10de:2204"

[tool.pixi.feature.isaacgym.tasks]
test_deps = "python -c 'import isaacgym, torch; print(torch.cuda.is_available())'"
# build gymtorch here, so that vscode debugging can be used
build_gymtorch = "cd third_party/gymtorch; python setup.py clean; python setup.py develop"
test = "pytest tests -q"

[tool.pytest.ini_options]
pythonpath = ["."]
# torch 2.12 deprecates torch.jit.script, used here and in smpl_sim
filterwarnings = ["ignore:`torch.jit.script` is deprecated:DeprecationWarning"]

[tool.ruff]
target-version = "py38"
line-length = 120
indent-width = 4

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = ["E4", "E7", "E9", "F"]
ignore = []

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = false

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"
