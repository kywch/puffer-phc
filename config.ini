# This is the default config file for the train script.
# It can be used for train, eval, and sweep.

[base]
env_name = puffer_phc
policy_name = PHCPolicy
# rnn_name = Recurrent

[policy]
hidden_size = 512

[rnn]
input_size = 512
hidden_size = 512

[env]
backend = mujoco_gpu
# mujoco_cpu / mujoco_gpu only. Training: newton_120 (default) or newton_180 (higher fidelity, slower).
# Eval of the provided Isaac Gym checkpoint: isaacgym_parity_240 (isaacgym_parity_480: higher fidelity, ~2x the cost).
solver_preset = newton_120
motion_file = "sample_data/cmu_mocap_05_06.pkl"
has_self_collision = True
num_envs = 4096
headless = True
use_amp_obs = False
# pmcp: half the env slots go to motions that failed recent evals; uniform: least-recently-loaded round robin
motion_sampling = pmcp
# sgs: episode starts favor bins whose success rate is near start_sampling_target; uniform: uniform starts
start_sampling = sgs
start_sampling_target = 0.5
termination_distance = 0.25
kp_scale = 1.0
kd_scale = 1.0
# dof_force is the real PD torque on mujoco, ~5-9x gym's, so 5x below gym's 0.0005
rew_power_coef = 0.0001

# [<section>.<backend>] overrides [<section>] for that backend (values tuned on Isaac Gym)
[env.isaacgym]
rew_power_coef = 0.0005

# torch 2.3.1 in the isaacgym env has no torch.optim.Muon
[train.isaacgym]
optimizer = "adam"

[train]
seed = 1
torch_deterministic = True
device = cuda

cpu_offload = False
compile = False
# Not worth it at 4096 envs (the update is GEMM-bound): "default" +0.6% SPS, "reduce-overhead" -2%
compile_mode = "default"
# bf16 autocast for the policy MLPs in rollout and update; the mu/value heads, losses and optimizer stay fp32
bf16 = True
norm_adv = True
target_kl = None

total_timesteps = 800_000_000

data_dir = experiments
checkpoint_interval = 2100
# Every resample first evaluates all motions; failed motions get more slots (motion_sampling = pmcp)
motion_resample_interval = 500

batch_size = 131072
minibatch_size = 32768

learning_rate = 0.0001
# adam, or muon: Muon on 2-D weights except the output heads, Adam on the rest (same learning_rate)
optimizer = "muon"
# Muon momentum (Nesterov); unused by adam
momentum = 0.95
# Keep this for other envs
anneal_lr = False
# Using exp decay: exp(-decay_rate * steps)
lr_decay_rate = 1.5e-4
# With the decay floor, the LR does not decay below LR * decay_floor
lr_decay_floor = 0.2

update_epochs = 4
bptt_horizon = 8
gae_lambda = 0.2
gamma = 0.98
clip_coef = 0.01
vf_coef = 1.2
clip_vloss = True
vf_clip_coef = 0.2
max_grad_norm = 10.0
ent_coef = 0.0
disc_coef = 5.0
# 0: never active before (read without grad); PHC used 10, untested here
bound_coef = 0.0
l2_reg_coef = 0.0

[sweep.metric]
goal = maximize
# name = environment/episode_return
# name = eval/success_rate
name = environment/episode_length

[sweep.parameters.train.parameters.total_timesteps]
distribution = log_uniform_values
min = 20_000_000
max = 80_000_000

[sweep.parameters.train.parameters.learning_rate]
distribution = log_uniform_values
min = 1e-5
max = 1e-3

; [sweep.parameters.train.parameters.gamma]
; distribution = uniform
; min = 0.0
; max = 1.0

[sweep.parameters.train.parameters.gae_lambda]
distribution = uniform
min = 0.0
max = 1.0

[sweep.parameters.train.parameters.clip_coef]
distribution = uniform
min = 0.0
max = 1.0

[sweep.parameters.train.parameters.vf_coef]
distribution = uniform
min = 0.0
max = 5.0

; [sweep.parameters.train.parameters.vf_clip_coef]
; distribution = uniform
; min = 0.0
; max = 1.0

[sweep.parameters.train.parameters.update_epochs]
distribution = int_uniform
min = 1
max = 6

; [sweep.parameters.train.parameters.minibatch_size]
; distribution = log_uniform_values
; min = 8192
; max = 65536

; [sweep.parameters.env.parameters.rew_power_coef]
; distribution = log_uniform_values
; min = 1e-4
; max = 1e-2
